name: CI/CD pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t my-cicdapp .

      - name: Run Docker container
        run: docker run -p 8080:80 -d --name test my-cicdapp

      - name: Wait for application
        run: sleep 5

      - name: Test application
        run: curl --fail http://localhost:8080

      - name: Stop container
        if: always()
        run: docker stop test